name: zuirock

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zuirock
      POSTGRES_PASSWORD: zuirock
      POSTGRES_DB: zuirock
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zuirock -d zuirock']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    # Room state must never be evicted silently; fail writes instead (plan §2.3(d)).
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'noeviction', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
